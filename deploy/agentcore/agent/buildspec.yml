# AWS CodeBuild (ARM host): build the agent image and push it to ECR.
# StartBuild passes ECR_REPO (repository URI) and IMAGE_TAG; the source is the zip made by
# deploy/agentcore/package_source.py agent.
version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
  build:
    commands:
      - docker build -f deploy/agentcore/agent/Dockerfile -t "$ECR_REPO:$IMAGE_TAG" -t "$ECR_REPO:latest" .
  post_build:
    commands:
      - docker push "$ECR_REPO:$IMAGE_TAG"
      - docker push "$ECR_REPO:latest"
      - docker image inspect "$ECR_REPO:$IMAGE_TAG" --format 'arch={{.Architecture}} size={{.Size}}'
