version: 2

sources:
  - name: raw
    description: Loaded by Python (pipeline/). dbt only reads these tables.
    database: "{{ target.database }}"
    schema: RAW
    tables:
      - name: alerts_history
        description: >
          One full snapshot of every current MBTA alert, appended by GitHub Actions
          (load_alerts.yml). Scheduled every 30 minutes, but GitHub runs it only a few
          times a day, so snapshots are usually 4 to 15 hours apart. An alert repeats in
          every snapshot while it is active. LOADED_AT is UTC.
        # LOADED_AT has no timezone; dbt v2 warns that it assumes UTC (dbt9002), which is correct.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 12, period: hour}
            error_after: {count: 24, period: hour}
      - name: stations
        description: >
          Parent stations from the MBTA API (rail plus Silver Line Waterfront), replaced by
          pipeline/build_db.py.
      - name: facilities
        description: >
          Elevators, escalators and lifts from the MBTA API, replaced by build_db.py. Only
          as current as the last build_db.py run, so newer elevators can be missing.

  - name: logs
    database: "{{ target.database }}"
    schema: LOGS
    tables:
      - name: agent_log
        description: One row per planned trip, written by agents/logger.py. LOGGED_AT is UTC.
