name: Load MBTA alerts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      MBTA_KEY: ${{ secrets.MBTA_API_KEY }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            dbt/requirements.txt
      - run: pip install -r pipeline/requirements.txt -r dbt/requirements.txt

      # How old the data was before this run. GitHub skips many scheduled runs, so this
      # catches long gaps. Warn after 12 h, fail after 24 h, but never block the load.
      - name: Check alert freshness (dbt)
        run: python dbt/run_dbt.py source freshness --target prod
        continue-on-error: true

      - run: python pipeline/load_alerts.py

      # Same warehouse session window as the load, so dbt adds seconds, not a new wake-up.
      # Unit tests check model logic and run locally; production runs models and data tests.
      - name: Build models and data tests (dbt)
        run: python dbt/run_dbt.py build --target prod --exclude-resource-type unit_test
